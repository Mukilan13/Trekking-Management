{% extends "base.html" %}{% block title %}My Profile | Trekwiser{% endblock %}{%
block content %}
<div class="container" style="max-width: 650px">
  <h1 class="h2 mb-4">My profile</h1>
  <form method="post" class="card shadow-sm">
    <div class="card-body p-4">
      <div class="mb-3">
        <label class="form-label">Full name</label
        ><input
          name="name"
          class="form-control"
          value="{{current_user.name}}"
          required
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label
        ><input class="form-control" value="{{current_user.email}}" disabled />
      </div>
      <div class="mb-4">
        <label class="form-label">Phone number</label
        ><input
          name="phone"
          pattern="[0-9]{10}"
          class="form-control"
          value="{{current_user.phone}}"
          required
        />
      </div>
      <button class="btn btn-primary">Save profile</button>
      <a href="{{url_for('user.dashboard')}}" class="btn btn-outline-secondary ml-4"
        >Cancel</a
      >
    </div>
  </form>
</div>
{% endblock %}

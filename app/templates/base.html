<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Trekwiser | Trek Management{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --forest: #173f35;
        --leaf: #2d7a5b;
        --mist: #eff7f2;
        --ink: #17221e;
      }

      body {
        background: var(--mist);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      .navbar {
        background: rgba(23, 63, 53, 0.97);
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border-radius: 0.65rem;
        background: #8dd39e;
        color: var(--forest);
        font-weight: 800;
      }

      .btn-primary {
        --bs-btn-bg: var(--leaf);
        --bs-btn-border-color: var(--leaf);
        --bs-btn-hover-bg: #226448;
        --bs-btn-hover-border-color: #226448;
      }

      .btn-outline-primary {
        --bs-btn-color: var(--leaf);
        --bs-btn-border-color: var(--leaf);
        --bs-btn-hover-bg: var(--leaf);
        --bs-btn-hover-border-color: var(--leaf);
      }

      .page-shell {
        min-height: calc(100vh - 144px);
      }

      .auth-card {
        border: 0;
        border-radius: 1.25rem;
        box-shadow: 0 18px 45px rgba(23, 63, 53, 0.12);
      }

      .form-control,
      .form-select {
        border-radius: 0.7rem;
        padding: 0.72rem 0.85rem;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: #72b895;
        box-shadow: 0 0 0 0.25rem rgba(45, 122, 91, 0.15);
      }

      .password-wrap {
        position: relative;
      }

      .password-wrap .form-control {
        padding-right: 4.3rem;
      }

      .password-toggle {
        position: absolute;
        top: 50%;
        right: 0.45rem;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: #527066;
        padding: 0.45rem;
      }

      .password-toggle:hover {
        color: var(--forest);
      }

      footer {
        color: #64736c;
      }
    </style>
    {% block head %}{% endblock head %}
  </head>

  <body>
    <nav class="navbar navbar-expand-md navbar-dark py-3 shadow-sm">
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2 fw-bold"
          href="{{ url_for('main.home') }}"
          ><span class="brand-mark" aria-hidden="true">▲</span> Trekwiser</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav ms-auto align-items-md-center gap-md-2">
            <a class="nav-link" href="{{ url_for('main.home') }}">Home</a>
            <a class="btn btn-light btn-sm px-3 mt-2 mt-md-0" href="">Log in</a>
          </div>
        </div>
      </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
